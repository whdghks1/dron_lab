<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRONE LAB — Riverside flight</title><meta name="description" content="강변 공원에서 즐기는 3D 드론 비행. 자유롭게 날고 게이트 코스에 도전하세요."><link rel="stylesheet" href="style.css"></head><body><canvas id="world" aria-label="3D 드론 비행장"></canvas><header><div class="brand"><span class="mark">✣</span> DRONE LAB <span class="tag">FLIGHT SIMULATOR</span></div><div class="location">RIVERSIDE PARK <span>가상 강변 비행장</span></div><button id="pause">일시정지 <kbd>P</kbd></button></header><aside class="mission"><div class="eyebrow">FLIGHT SESSION / 01</div><h1>강변을 날다.</h1><p>물길을 따라, 원하는 속도로.</p><div class="modes"><button id="free" class="selected">자유 비행</button><button id="race">게이트 챌린지</button></div><div class="course"><span id="objective">비행 준비 완료</span><strong id="progress">FREE FLIGHT</strong><div id="segments"></div><p id="hint">비행 시작을 누르고 W로 전진하세요.</p></div><button class="launch" id="start">비행 시작 <span>↗</span></button><div class="minirow"><span>CAMERA</span><button id="camera">추적 시점 <kbd>C</kbd></button></div><div class="minirow"><label for="wind">바람</label><select id="wind"><option value="0">고요함</option><option value="1">산들바람</option><option value="2">강한 바람</option></select></div><button class="reset" id="reset">↺ 출발점으로 돌아가기 <kbd>R</kbd></button></aside><div class="compass"><span>W</span><b id="heading">000° N</b><span>E</span></div><div class="crosshair">＋</div><div class="toast" id="toast" role="status">READY TO EXPLORE</div><aside class="map"><div class="eyebrow">FLIGHT MAP <span>북 ↑</span></div><canvas id="map" width="220" height="160"></canvas><div class="mapkey"><i></i>드론 <i></i>다음 게이트</div></aside><footer><div class="stat"><label>속도</label><strong id="speed">0.0</strong><span>km/h</span></div><div class="stat"><label>고도</label><strong id="alt">2.0</strong><span>m</span></div><div class="stat"><label>비행 시간</label><strong id="time">00:00</strong></div><div class="stat"><label>비행 거리</label><strong id="distance">0</strong><span>m</span></div><div class="status"><span id="state">STANDBY</span><small>고도 유지 · 조종 보조 ON</small></div></footer><div class="help"><span><kbd>W A S D</kbd> 이동</span><span><kbd>↑ ↓</kbd> 상승·하강</span><span><kbd>Q E</kbd> 회전</span><span><kbd>SPACE</kbd> 브레이크</span><span><kbd>SHIFT</kbd> 부스트</span></div><div class="touch"><div><button data-key="q">↶</button><button data-key="w">▲</button><button data-key="e">↷</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><div><button data-key="arrowup">상승</button><button data-key="arrowdown">하강</button></div></div><script src="app.js"></script></body></html>
